<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesa &amp; Ficha — minijuegos online</title>
    <meta
      name="description"
      content="Abrí una mesa, pasá el código por WhatsApp y jugá con amigos. Ta-te-ti, chinchón, ahorcado y batalla naval, para 2 a 4."
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <!-- ============ Topbar (F0.3.1) ============ -->
    <header class="sticky top-0 z-30 border-b-2 border-ink bg-cream/90 backdrop-blur">
      <div class="container max-w-[1160px] flex items-center gap-4 py-3">
        <a
          href="/"
          class="font-display font-extrabold text-xl tracking-[-.02em] flex items-center gap-2.5 shrink-0"
        >
          <span
            class="w-9 h-9 grid place-items-center rounded-[11px] border-2 border-ink bg-terra text-paper text-base shadow-hard -rotate-3"
            >◈</span
          >
          Mesa &amp; Ficha
        </a>

        <!-- enlaces: solo en web (≥ md) -->
        <nav class="ml-auto hidden md:flex gap-1" aria-label="Principal">
          <a href="#catalogo" class="px-3 py-2 rounded-[9px] text-sm font-semibold text-ink-2 hover:bg-cream-2">Juegos</a>
          <a href="#como-va" class="px-3 py-2 rounded-[9px] text-sm font-semibold text-ink-2 hover:bg-cream-2">Cómo funciona</a>
          <a href="/creditos.html" class="px-3 py-2 rounded-[9px] text-sm font-semibold text-ink-2 hover:bg-cream-2">Créditos</a>
        </nav>

        <!-- estado en vivo: siempre -->
        <span class="pill ml-auto md:ml-2"><span class="dot"></span> en línea</span>

        <!-- botón menú: solo mobile (se cablea en F0.3.2) -->
        <button class="md:hidden btn !p-2 !shadow-hard-sm" aria-label="Abrir menú" data-sheet="menu">☰</button>
      </div>
    </header>

    <!-- ============ Contenido (se arma en F0.3.3–F0.3.6) ============ -->
    <main class="container max-w-[1160px] pb-24 md:pb-12">
      <section class="py-16 text-center">
        <span class="badge-rot">◉ en construcción</span>
        <h1 class="font-display font-extrabold text-[clamp(2rem,5vw,3.25rem)] tracking-[-.025em] my-4">
          El portal se está armando <mark class="bg-terra text-paper px-1 rounded-lg">de a poco</mark>.
        </h1>
        <p class="text-ink-2 max-w-[46ch] mx-auto">
          Estás viendo la topbar (tarea F0.3.1). El hero, el catálogo y el resto llegan en las próximas
          tareas del roadmap.
        </p>
        <div class="flex flex-wrap justify-center gap-3 mt-6">
          <a href="/styleguide.html" class="btn btn-primary">Ver el sistema de diseño ▷</a>
        </div>
      </section>
    </main>
  </body>
</html>
